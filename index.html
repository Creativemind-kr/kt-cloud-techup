          '<section class="section"><div class="section-grid"><header class="section-heading"><span class="section-index">11 · 최종 결과물 예시</span><h2>완성하면 <br>이렇게 보입니다</h2><p>SBS아카데미AIX학원 공개 수강생 포트폴리오 중 과정 설명에 활용하기 좋은 작품입니다.</p></header><div><div class="portfolio-intro"><p>'+esc(course.portfolioGuide)+'</p><a href="https://sbsaix.com/portfolio/index.asp?selMater=web" target="_blank" rel="noopener">전체 포트폴리오 보기</a></div><div class="portfolio-grid">'+list(course.portfolioExamples,item=>'<article class="portfolio-card"><a href="'+esc(item.link)+'" target="_blank" rel="noopener"><div class="portfolio-image"><img src="'+esc(item.image)+'" alt="'+esc(item.title)+' SBS아카데미AIX학원 수강생 포트폴리오" loading="lazy"><span class="arrow" aria-hidden="true">↗</span></div><div class="portfolio-body"><div class="portfolio-meta"><b>SBS AIX PORTFOLIO</b><span>'+esc(item.author)+'</span></div><h3>'+esc(item.title)+'</h3><p class="portfolio-tools">'+esc(item.tools)+'</p></div></a></article>')+'</div>'+(course.componentShowcase?'<article class="component-showcase"><div class="component-showcase-head"><div><b>UI COMPONENT STUDY</b><h3>'+esc(course.componentShowcase.title)+'</h3></div><p>'+esc(course.componentShowcase.description)+'</p></div><div class="component-showcase-image"><img src="'+esc(course.componentShowcase.image)+'" alt="'+esc(course.componentShowcase.alt)+'" loading="lazy"></div><div class="component-showcase-tags">'+list(course.componentShowcase.items,item=>'<span>'+esc(item)+'</span>')+'</div></article>':'')+'<p class="portfolio-note"><strong>결과물 예시 안내:</strong> SBS아카데미AIX학원의 공개 웹·UIUX 수강생 포트폴리오를 활용한 유사 결과물 예시이며, KT cloud TECH UP 해당 과정의 실제 수료작은 아닙니다. 실제 프로젝트 주제와 결과물은 과정 운영에 따라 달라집니다.</p></div></div></section>'+
        '</div><footer class="source"><div class="shell">최신 과정 정보: <a href="'+esc(course.officialUrl)+'" target="_blank" rel="noopener">고용24 '+esc(course.label)+' 공식 과정 페이지</a> · 실제 일정, 지원 금액, 프로젝트 주제는 최신 공고가 우선이며 채용 또는 수료를 보장하지 않습니다.</div></footer>'+
      '</article>';
      const portfolioSection = app.querySelector('.portfolio-grid')?.closest('.section');
      if(portfolioSection){
        const sectionDescription = portfolioSection.querySelector('.section-heading p');
        if(sectionDescription) sectionDescription.textContent = '과정에서 만들 수 있는 결과물을 작품 이미지와 이름으로 확인합니다.';
        portfolioSection.querySelector('.portfolio-intro a')?.remove();
        portfolioSection.querySelectorAll('.portfolio-card').forEach(card=>{
          const link = card.querySelector(':scope > a');
          if(!link) return;
          link.querySelector('.arrow')?.remove();
          link.querySelector('.portfolio-meta')?.remove();
          link.querySelector('.portfolio-tools')?.remove();
          const title = link.querySelector('h3')?.textContent || '작품 예시';
          const image = link.querySelector('img');
          if(image) image.alt = title+' 작품 예시';
          const staticCard = document.createElement('div');
          staticCard.className = 'portfolio-static';

      }
      const portfolioNote = app.querySelector('.portfolio-note');
      if(portfolioNote) portfolioNote.innerHTML = '<strong>결과물 예시 안내:</strong> 상단 작품 이미지는 직무별 결과물 이해를 돕기 위한 참고 예시이며, 하단 실무 화면은 공개 자료를 바탕으로 구성했습니다. KT cloud TECH UP 해당 과정의 실제 수료작은 아니며, 프로젝트 주제와 결과물은 과정 운영에 따라 달라집니다.';
      const componentShowcase = app.querySelector('.component-showcase');
      if(componentShowcase && course.componentShowcase?.explanation){
        const showcaseKicker = componentShowcase.querySelector('.component-showcase-head b');
        if(showcaseKicker && course.componentShowcase.kicker) showcaseKicker.textContent = course.componentShowcase.kicker;
        const sourceLink = course.componentShowcase.sourceUrl ? '<a class="component-showcase-source" href="'+esc(course.componentShowcase.sourceUrl)+'" target="_blank" rel="noopener">'+esc(course.componentShowcase.sourceTitle||'공개 예시 출처 확인')+' ↗</a>' : '';
        componentShowcase.insertAdjacentHTML('beforeend','<div class="component-showcase-explain"><b>어떤 작업인가요?</b><div><p>'+esc(course.componentShowcase.explanation)+'</p>'+sourceLink+'</div></div>');

    }

        '<div class="shell work24-content"><div class="process-head"><div><small>01 · 전체 진행 프로세스</small><h2>문의부터 최종 등록까지</h2></div><p>카드 발급 여부와 최신 모집공고에 따라 실제 진행 순서와 안내 시점은 달라질 수 있습니다.</p></div>'+
        '<div class="process-flow">'+
          '<article class="process-step"><span class="n">STEP 01</span><h3>과정 문의 · 상담</h3><p>희망 직무와 관심 과정을 확인하고 <strong>수강 가능 여부에 필요한 기본 조건</strong>을 함께 확인합니다.</p></article>'+
          '<article class="process-step"><span class="n">STEP 02</span><h3>국민내일배움카드 발급</h3><p>카드가 없다면 고용24에서 먼저 신청합니다. 심사와 카드 수령까지 시간이 걸릴 수 있어 <strong>미리 신청하는 것이 안전</strong>합니다.</p></article>'+
          '<article class="process-step"><span class="n">STEP 03</span><h3>고용24 수강신청</h3><p>카드 발급 후 고용24에서 해당 TECH UP 과정을 확인해 <strong>수강신청을 완료</strong>합니다.</p></article>'+
          '<article class="process-step"><span class="n">STEP 04</span><h3>지원 정보 · 서류 확인</h3><p>지원 마감 후 제출 내용과 지원 조건을 확인하고, 이후 절차는 <strong>개별 안내</strong>로 진행됩니다.</p></article>'+
          '<article class="process-step"><span class="n">STEP 05</span><h3>Zoom 면접</h3><p>면접 대상자에게 일정을 안내하고 Zoom으로 면접을 진행합니다. <strong>정확한 면접 방식과 일정은 최신 공고</strong>가 우선입니다.</p></article>'+
          '<article class="process-step"><span class="n">STEP 06</span><h3>최종 등록 · 개강 안내</h3><p>최종 결과와 등록에 필요한 사항을 안내받고, 교육 시작 전 온보딩 및 개강 안내를 확인합니다.</p></article>'+
        '</div>'+
        '<section class="training-files"><div class="training-files-head"><div><small>02 · 과정별 훈련탐색표</small><h3>희망 과정의 훈련탐색표 확인</h3></div><p>과정별 세부 훈련정보가 필요할 때 해당 PDF를 새 창으로 열어 확인합니다.</p></div><div class="training-file-grid">'+list(DATA.courses,c=>'<article class="training-file-card"><b>'+esc(c.label)+'</b><span>과정별 훈련과정 상세 자료</span><a href="#" data-training-label="'+esc(c.label)+'">훈련탐색표 확인하기</a></article>')+'</div></section>'+
        '<div class="work24-grid"><article class="work24-card"><h3>국민내일배움카드 발급 순서</h3><p class="sub">상담 시 학생과 화면을 함께 보면서 아래 순서로 안내하면 됩니다.</p><ol><li><strong>고용24</strong>에 접속해 로그인합니다.</li><li><strong>직업능력개발</strong> 메뉴에서 국민내일배움카드를 찾습니다.</li><li><strong>발급 신청</strong> 안내를 확인하고 신청서를 작성합니다.</li><li>고용센터 심사 및 카드사 절차를 진행합니다.</li><li>카드 발급 후 <strong>TECH UP 과정 수강신청</strong>으로 이어갑니다.</li></ol></article><article class="work24-card"><h3>상담 중 확인할 항목</h3><ul><li>국민내일배움카드 <strong>보유 / 발급 진행 상태</strong></li><li>고용24에서 해당 과정 <strong>수강신청 완료 여부</strong></li><li>최신 모집공고의 <strong>지원 마감일·교육기간</strong></li><li>개인별 적용 가능한 <strong>정부지원 및 본인부담 조건</strong></li><li><strong>Zoom 면접</strong> 일정 안내 수신 여부</li></ul></article></div>'+
        '<div class="work24-cta"><div><strong>고용24에서 국민내일배움카드 발급 안내 확인</strong>새 창에서 고용24 공식 안내 페이지를 열어 학생과 함께 확인할 수 있습니다.</div><a href="https://www.work24.go.kr/hr/h/a/1100/selectIssuGudn.do" target="_blank" rel="noopener">고용 24 클릭하여 확인</a></div>'+
        '<p class="process-note"><strong>안내 기준:</strong> 카드 발급, 수강신청, 면접, 본인부담금 등 세부 조건과 순서는 개인 상황 및 최신 모집공고에 따라 달라질 수 있습니다. 상담 시 최신 공식 공고와 고용24 화면을 최종 기준으로 확인합니다.</p></div></article>';
    }

    function setGuide(mode, scroll){
      activeGuide = mode;
      const isWork24 = mode === 'work24';
      document.body.classList.toggle('work24-mode',isWork24);
      courseGuideBtn.setAttribute('aria-selected',String(!isWork24));
      work24GuideBtn.setAttribute('aria-selected',String(isWork24));
      if(isWork24){
        history.replaceState(null,'','#work24');
        renderWork24();
      }else{
        const course=DATA.courses[activeIndex];
        history.replaceState(null,'','#'+course.slug);
        render(course);
      }
      if(scroll) window.scrollTo({top:0,behavior:'smooth'});
    }

    function selectCourse(index, scroll){
      activeIndex=index;
      activeGuide='course';
      document.body.classList.remove('work24-mode');
      courseGuideBtn.setAttribute('aria-selected','true');
      work24GuideBtn.setAttribute('aria-selected','false');
      const course=DATA.courses[index];
      history.replaceState(null,'','#'+course.slug);
      [...tabs.children].forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1;});
      render(course);
      if(scroll) window.scrollTo({top:0,behavior:'smooth'});
    }

    backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    courseGuideBtn.addEventListener('click',()=>setGuide('course',true));
    work24GuideBtn.addEventListener('click',()=>setGuide('work24',true));
    nextCourse.addEventListener('click',()=>selectCourse((activeIndex+1)%DATA.courses.length,true));
    addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;scrollProgress.style.setProperty('--scroll',(max>0?scrollY/max*100:0)+'%')},{passive:true});
    createTabs(); activeGuide==='work24' ? setGuide('work24',false) : selectCourse(activeIndex,false);
  </script>

<script>
  function openTrainingSheet(label) {
    const pdfUrl = TRAINING_SHEETS[label];
    if (!pdfUrl) {
      alert('해당 과정의 훈련탐색표를 찾을 수 없습니다.');
      return;
    }
    window.open(pdfUrl, '_blank', 'noopener');
  }

  document.addEventListener('click', function(event) {
    const trigger = event.target.closest('[data-training-label]');
    if (!trigger) return;
    event.preventDefault();
    openTrainingSheet(trigger.getAttribute('data-training-label'));
  });

  let unifiedWorkspace = 'consulting';

  function setUnifiedWorkspace(next) {
    unifiedWorkspace = next;
    const consulting = document.getElementById('consultingWorkspace');
    const training = document.getElementById('trainingWorkspace');
    const consultingBtn = document.getElementById('consultingWorkspaceBtn');
    const trainingBtn = document.getElementById('trainingWorkspaceBtn');
    const label = document.getElementById('workspaceModeLabel');

    consulting.hidden = next !== 'consulting';
    training.hidden = next !== 'training';
    consultingBtn.setAttribute('aria-selected', String(next === 'consulting'));
    trainingBtn.setAttribute('aria-selected', String(next === 'training'));
    label.textContent = next === 'training' ? '컨택교육용 모드' : '태블릿 상담 모드';
    document.body.classList.toggle('training-active', next === 'training');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('consultingWorkspaceBtn').addEventListener('click', () => setUnifiedWorkspace('consulting'));
  document.getElementById('trainingWorkspaceBtn').addEventListener('click', () => setUnifiedWorkspace('training'));
</script>
